# Development only: one setup for every skill's tests and linting. Skills don't install
# anything from here; a script that needs a package declares it inline for `uv run`.
[project]
name = "whimsical-skills"
version = "0.0.0"
description = "Agent skills that build Whimsical boards with the Whimsical MCP."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pillow>=11,<13", "httpx>=0.27,<1", "ruff>=0.6"]

[tool.uv]
package = false

# Run each tests/ folder in its own pytest process (CONTRIBUTING.md has the loop): every
# skill's tests have their own conftest.py, and those would clash in a single run.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B905"]
