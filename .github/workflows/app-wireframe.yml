name: app-wireframe

on:
  push:
    branches: [main]
    paths: [plugins/app-wireframe/**, .github/workflows/app-wireframe.yml]
  pull_request:
    paths: [plugins/app-wireframe/**, .github/workflows/app-wireframe.yml]

defaults:
  run:
    working-directory: plugins/app-wireframe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev ruff check .
      - run: uv run --group dev pytest
